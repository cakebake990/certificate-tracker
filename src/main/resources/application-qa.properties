# Database-dependent profile. Required placeholders deliberately have no defaults.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.datasource.url=${CERTTRACK_DB_URL}
spring.datasource.username=${CERTTRACK_DB_USERNAME}
spring.datasource.password=${CERTTRACK_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
