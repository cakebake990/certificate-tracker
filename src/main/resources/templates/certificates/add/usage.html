<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add Certificate — Function and Usage</title><link rel="stylesheet" href="/css/terminal.css"></head><body><main class="terminal-frame wizard" aria-labelledby="page-title"><nav th:replace="~{fragments/navigation :: primary}"></nav><header class="terminal-titlebar"><div><p class="step">Step 3 of 5</p><h1 id="page-title">What is this certificate used for?</h1></div></header><section class="terminal-panel question-screen"><form method="post" action="/certificates/new/usage" th:object="${certificateWizard}"><fieldset th:aria-describedby="${#fields.hasErrors('functionUsageCodes')} ? 'usage-error'"><legend>Select at least one Function / Usage</legend><div class="choice-grid"><label th:each="o:${options.functionUsages}" class="choice"><input type="checkbox" th:field="*{functionUsageCodes}" th:value="${o.value}"><span th:text="${o.label}"></span></label></div></fieldset><p id="usage-error" class="field-error" th:if="${#fields.hasErrors('functionUsageCodes')}" th:errors="*{functionUsageCodes}"></p><div class="wizard-actions"><a class="secondary-button" href="/certificates/new/details">Back</a><button type="submit">Continue</button></div></form><form class="cancel-form" method="post" action="/certificates/new/cancel"><button class="link-button" type="submit">Cancel</button></form></section><footer th:replace="~{fragments/navigation :: commands}"></footer></main></body></html>
