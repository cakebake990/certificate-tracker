<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add Certificate — Review</title><link rel="stylesheet" href="/css/terminal.css"></head><body><main class="terminal-frame wizard" aria-labelledby="page-title"><nav th:replace="~{fragments/navigation :: primary}"></nav><header class="terminal-titlebar"><div><p class="step">Step 5 of 5</p><h1 id="page-title">Ready to add this certificate?</h1></div></header><section class="terminal-panel question-screen"><div class="message error" role="alert" th:if="${#fields.hasErrors('certificateWizard.*')}" th:each="e:${#fields.errors('certificateWizard.*')}" th:text="${e}"></div><div class="review-grid"><section><h2>Customer and Certificate <a href="/certificates/new/customer">Edit</a></h2><dl><dt>Customer</dt><dd th:text="${selectedCustomer}"></dd><dt>Name</dt><dd th:text="${certificateWizard.name}"></dd><dt>Type</dt><dd th:text="${selectedType}"></dd><dt>Expiration</dt><dd th:text="${certificateWizard.expirationDate}"></dd><dt>Issuer</dt><dd th:text="${certificateWizard.issuer ?: 'Not recorded'}"></dd><dt>Serial</dt><dd th:text="${certificateWizard.serialNumber ?: 'Not recorded'}"></dd><dt>Fingerprint</dt><dd th:text="${certificateWizard.fingerprint ?: 'Not recorded'}"></dd><dt>Subject / CN</dt><dd th:text="${certificateWizard.subjectCommonName ?: 'Not recorded'}"></dd></dl></section><section><h2>Function / Usage <a href="/certificates/new/usage">Edit</a></h2><ul><li th:each="v:${selectedUsages}" th:text="${v}"></li></ul></section><section><h2>Where Used <a href="/certificates/new/where-used">Edit</a></h2><p><strong>Systems:</strong> <span th:text="${selectedSystems.isEmpty() ? 'None recorded' : #strings.listJoin(selectedSystems, ', ')}"></span></p><p><strong>Environments:</strong> <span th:text="${selectedEnvironments.isEmpty() ? 'None recorded' : #strings.listJoin(selectedEnvironments, ', ')}"></span></p><p><strong>Hostnames:</strong> <span th:text="${certificateWizard.hostnames.isEmpty() ? 'None recorded' : #strings.listJoin(certificateWizard.hostnames, ', ')}"></span></p><p><strong>Sites:</strong> <span th:text="${selectedSites.isEmpty() ? 'None recorded' : #strings.listJoin(selectedSites, ', ')}"></span></p></section><section th:if="${certificateWizard.notes != null and !certificateWizard.notes.isBlank()}"><h2>Notes</h2><p class="preserve-lines" th:text="${certificateWizard.notes}"></p></section></div><div class="wizard-actions"><a class="secondary-button" href="/certificates/new/where-used">Back</a><form method="post" action="/certificates/new/complete"><button type="submit">Add Certificate</button></form></div><form class="cancel-form" method="post" action="/certificates/new/cancel"><button class="link-button" type="submit">Cancel</button></form></section><footer th:replace="~{fragments/navigation :: commands}"></footer></main></body></html>
