<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add Certificate — Details</title><link rel="stylesheet" href="/css/terminal.css"></head><body><main class="terminal-frame wizard" aria-labelledby="page-title"><nav th:replace="~{fragments/navigation :: primary}"></nav><header class="terminal-titlebar"><div><p class="step">Step 2 of 5</p><h1 id="page-title">Tell us about the certificate.</h1></div></header><section class="terminal-panel question-screen"><div class="message error" role="alert" th:if="${#fields.hasErrors('certificateWizard.*')}">Correct the highlighted fields.</div>
<form method="post" action="/certificates/new/details" th:object="${certificateWizard}" class="form-grid"><label>Certificate Name <input th:field="*{name}" required maxlength="200" th:classappend="${#fields.hasErrors('name')} ? 'invalid'"></label><p class="field-error" th:errors="*{name}"></p><label>Certificate Type <select th:field="*{certificateTypeCode}" required><option value="">Select a type</option><option th:each="o:${options.certificateTypes}" th:value="${o.value}" th:text="${o.label}"></option></select></label><p class="field-error" th:errors="*{certificateTypeCode}"></p><label>Expiration Date <input type="date" th:field="*{expirationDate}" required></label><p class="field-error" th:errors="*{expirationDate}"></p><label>Issuer <input th:field="*{issuer}" maxlength="500"></label><label>Serial Number <input th:field="*{serialNumber}" maxlength="200"></label><label>Fingerprint / Thumbprint <input th:field="*{fingerprint}" maxlength="256" aria-describedby="fingerprint-help"><small id="fingerprint-help">Spaces and colons are normalized when saved.</small></label><label>Subject / Common Name <input th:field="*{subjectCommonName}" maxlength="500"></label><label class="full">Notes <textarea th:field="*{notes}" rows="4"></textarea></label><div class="wizard-actions full"><a class="secondary-button" href="/certificates/new/customer">Back</a><button type="submit">Continue</button></div></form><form class="cancel-form" method="post" action="/certificates/new/cancel"><button class="link-button" type="submit">Cancel</button></form></section><footer th:replace="~{fragments/navigation :: commands}"></footer></main></body></html>
