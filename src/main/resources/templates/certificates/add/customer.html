<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add Certificate — Customer</title><link rel="stylesheet" href="/css/terminal.css"></head><body><main class="terminal-frame wizard" aria-labelledby="page-title"><nav th:replace="~{fragments/navigation :: primary}"></nav><header class="terminal-titlebar"><div><p class="step">Step 1 of 5</p><h1 id="page-title">Which customer is this certificate for?</h1></div></header><section class="terminal-panel question-screen">
<div class="message error" role="alert" th:if="${#fields.hasErrors('certificateWizard.*')}"><p>Correct the highlighted field.</p></div>
<div class="empty-state" th:if="${#lists.isEmpty(options.customers)}"><h2>No active customers</h2><p>A customer must be created outside this workflow before a certificate can be added.</p></div>
<form th:unless="${#lists.isEmpty(options.customers)}" method="post" action="/certificates/new/customer" th:object="${certificateWizard}"><label for="customerId">Customer <span aria-hidden="true">*</span></label><select id="customerId" th:field="*{customerId}" required th:aria-describedby="${#fields.hasErrors('customerId')} ? 'customerId-error'"><option value="">Select a customer</option><option th:each="o:${options.customers}" th:value="${o.value}" th:text="${o.label}"></option></select><p id="customerId-error" class="field-error" th:if="${#fields.hasErrors('customerId')}" th:errors="*{customerId}"></p><div class="wizard-actions"><button type="submit">Continue</button></div></form>
<form class="cancel-form" method="post" action="/certificates/new/cancel"><button class="link-button" type="submit">Cancel</button></form></section><footer th:replace="~{fragments/navigation :: commands}"></footer></main></body></html>
