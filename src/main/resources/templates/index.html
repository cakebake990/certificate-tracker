<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Certificate Tracker — Project Foundation</title>
    <link rel="stylesheet" href="/css/terminal.css">
</head>
<body>
<main class="terminal-frame" aria-labelledby="page-title">
    <nav th:replace="~{fragments/navigation :: primary}"></nav>
    <header class="terminal-titlebar">
        <h1 id="page-title">Certificate Tracker</h1>
        <span class="status status-ready" role="status">System ready<span aria-hidden="true">_</span></span>
    </header>
    <section class="terminal-panel" aria-labelledby="foundation-heading">
        <h2 id="foundation-heading">Project Foundation</h2>
        <p>Track certificate inventory, operational context, and expiration dates.</p>
        <div class="button-row">
            <a class="command-button" href="/certificates">View Certificates</a>
            <a class="command-button" href="/certificates/new">Add Certificate</a>
        </div>
    </section>
    <footer th:replace="~{fragments/navigation :: commands}"></footer>
</main>
</body>
</html>
